<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Sync Settings</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; }
      fieldset { margin-bottom: 16px; }
      label { display:block; margin: 6px 0; }
      input[type="text"], input[type="password"], input[type="date"], select { width: 100%; padding: 6px; }
      .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      button { margin-right: 8px; }
      pre { background:#f5f5f5; padding:10px; max-height:220px; overflow:auto; }
    </style>
  </head>
  <body>
    <h1>AI Chat → NotebookLM Sync</h1>
    <fieldset>
      <legend>NotebookLM</legend>
      <label>Target Notebook ID <input id="notebookId" type="text" /></label>
      <label>Session Mode
        <select id="notebookSessionMode">
          <option value="reuse-session">Reuse session cookies</option>
          <option value="manual-login">Manual login prompts</option>
        </select>
      </label>
    </fieldset>
    <fieldset>
      <legend>Sync Controls</legend>
      <div class="row">
        <label>Sync Mode
          <select id="syncMode"><option value="incremental">Incremental</option><option value="backfill">Backfill</option></select>
        </label>
        <label>Rate Limit (per minute) <input id="rateLimit" type="text" /></label>
      </div>
      <div class="row">
        <label>Start Date <input id="startDate" type="date" /></label>
        <label>End Date <input id="endDate" type="date" /></label>
      </div>
      <label>Last Browser Login Date (authoritative) <input id="lastBrowserLoginDate" type="date" /></label>
    </fieldset>
    <fieldset>
      <legend>Platform Inclusion</legend>
      <label><input id="chatgptEnabled" type="checkbox" /> ChatGPT</label>
      <label><input id="claudeEnabled" type="checkbox" /> Claude</label>
      <label><input id="geminiEnabled" type="checkbox" /> Gemini</label>
    </fieldset>
    <fieldset>
      <legend>Credentials (optional; prefer existing sessions)</legend>
      <div class="row"><label>ChatGPT Username <input id="chatgptUser" type="text" /></label><label>ChatGPT Password <input id="chatgptPass" type="password" /></label></div>
      <div class="row"><label>Claude Username <input id="claudeUser" type="text" /></label><label>Claude Password <input id="claudePass" type="password" /></label></div>
      <div class="row"><label>Gemini Username <input id="geminiUser" type="text" /></label><label>Gemini Password <input id="geminiPass" type="password" /></label></div>
    </fieldset>
    <button id="save">Save</button>
    <button id="diagnostics">Export Diagnostics</button>
    <div id="status"></div>
    <pre id="diag"></pre>
    <script type="module" src="options.js"></script>
  </body>
</html>
